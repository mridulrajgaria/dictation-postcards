<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="cork">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.72   0 0 0 0 0.52   0 0 0 0 0.33  0 0 0 0.35 0" />
    </filter>
  </defs>
  <rect width="200" height="200" fill="#a47244" />
  <rect width="200" height="200" filter="url(#cork)" opacity="0.8" />
  <!-- subtle cork flecks -->
  <circle cx="25" cy="40" r="2.5" fill="#7d5029" opacity="0.6"/>
  <circle cx="85" cy="110" r="3" fill="#69401f" opacity="0.5"/>
  <circle cx="160" cy="55" r="2" fill="#583418" opacity="0.6"/>
  <circle cx="130" cy="165" r="2.5" fill="#885b32" opacity="0.7"/>
  <circle cx="45" cy="145" r="3.5" fill="#5c381c" opacity="0.5"/>
</svg>
