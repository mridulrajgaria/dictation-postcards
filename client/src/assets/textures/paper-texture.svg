<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <filter id="paper-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.98   0 0 0 0 0.96   0 0 0 0 0.92  0 0 0 0.08 0" />
    </filter>
  </defs>
  <rect width="300" height="300" fill="#fcf9f2" />
  <rect width="300" height="300" filter="url(#paper-noise)" opacity="0.6" />
</svg>
